function salesCols(list, compact){
 const cols=[['제안서 보내야 함',s=>s.stage==='제안서 보내야 함'],['제안서 보냄 · 회신 대기',s=>s.stage==='제안서 보냄'],['리드 · 컨택 · 미팅',s=>['리드','컨택','미팅'].includes(s.stage)],['성사',s=>s.stage==='성사']];
 return cols.map(([h,f])=>{ const xs=list.filter(f); return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="row"><h3 style="font-size:15px">${h}</h3><b style="font-size:20px">${xs.length}</b></div>
 ${xs.map(s=>{ const late = (s.stage==='제안서 보냄'&&s.sent&&dnum(s.sent)<=-7) || (s.nextD&&dnum(s.nextD)<0);
  const line = s.stage==='제안서 보냄'? `발송 후 ${-dnum(s.sent)}일${dnum(s.sent)<=-7?' · 회신 없음':''}` : s.nextD? (dnum(s.nextD)<0?`다음 액션일 ${-dnum(s.nextD)}일 지남`:`${s.next} · ${md(s.nextD)}`) : (s.next||'');
  return `<div class="item ${late?'red':''}" style="flex-direction:column;align-items:flex-start;gap:3px"><b>${s.n}</b>${s.what?`<span class="small muted">${s.what}</span>`:''}<span class="small" style="${late?'color:var(--red);font-weight:700':'color:var(--mute2)'}">${line} · ${s.who}</span></div>`;}).join('')}
 ${h==='성사'?`<span class="s13 muted">진행중 예상 금액 합계 [금액]</span>`:''}</div>`;}).join('');
}

 home:[
  ['오늘 상태 숫자 4개',`<ul><li><b>마감 지난 업무</b> = 업무 DB, 진행상태 ∉ {완료, 보류} AND (목표일정 end ?? start) &lt; 오늘 + 마감일 없이 시작 후 21일 넘은 프로젝트 → 클릭 시 진행 현황 <code>health=지연</code></li><li><b>7일 안 마감</b> = 같은 조건으로 0~7일 → 캘린더</li><li><b>오늘 일정</b> = 구글 캘린더 3개 + 업무 DB 목표일정=오늘</li><li><b>발행 막힌 콘텐츠</b> = 콘텐츠 DB 상태≠발행완료 AND (발행일 &lt; 오늘 OR 발행일 없음 OR 사진수급필요) → 콘텐츠</li></ul>`],
  ['2주 안 중요 일정',`<ul><li>업무 DB 중요도=높음 AND 목표일정 end ∈ [오늘, 오늘+14]</li><li>가로 위치 = (end − 오늘)/14. 같은 날은 아래로 쌓음</li><li>시안에서는 중요도가 아직 비어 있어 주요 프로젝트 4개를 임의로 표시</li></ul>`],
  ['주간목표 · 팔로업',`<ul><li>주간목표: Supabase <code>weekly_goals(week_start, title, owners, done)</code>, 전원 편집, 월요일 0시에 새 주. 체크하면 달성률 즉시 반영</li><li>팔로업: 위 '마감 지난 업무'를 담당자별 group by, 지난 일수 내림차순. 담당자 없는 업무는 '담당자 없음' 그룹</li></ul>`],
  ['오늘·이번 주 흐름',`<ul><li>오늘 일정: 출처별 색(회사=파랑, 대표님=주황, 연차=회색, 노션=테두리)</li><li>콘텐츠: '준비 안 된 것'만 (사진수급필요, 발행일 없음)</li><li>결제 예정: 구독료 테이블 next_billing_date 이번 달</li></ul>`],
  ['정부지원사업',`<ul><li>필터: 업무 DB 카테고리=정부지원과제 AND 구분=프로젝트 AND 진행상태 ∉ {완료, 보류}</li><li>정렬: 목표일정 end 오름차순</li><li><b>마감일</b> = 목표일정 end</li><li><b>현재 진행상황</b> = 하위 항목(relation) 완료 수/전체 + '이번 주 업데이트' 텍스트. 비어 있으면 가장 최근 완료된 하위 업무</li><li><b>앞으로 할 것</b> = 하위 항목 중 미완료, 날짜순. 지남=빨강, 제목 없음=주황</li><li>'노션에서 열기' = 프로젝트 페이지 URL</li></ul>`],
  ['영업 활동',`<ul><li>노션 💼 영업활동 DB(<code>collection://424414e3-6631-8194-9a30-000b69eead25</code>)의 '단계'로 묶음</li><li>제안서 보내야 함 / 제안서 보냄 / 리드·컨택·미팅 / 성사 (드랍은 숨김)</li><li>빨강: 단계=제안서 보냄 AND 제안서 발송일+7 &lt; 오늘, 또는 다음 액션일 &lt; 오늘</li><li>현재 DB가 비어 있어 '예시 데이터로 보기' 토글만 있음</li></ul>`]],
 calendar:[
  ['출처 토글 · 사람 필터',`<ul><li>출처 칩 5개는 다중 토글(끄면 숨김). 기본 전부 켬, 선택은 localStorage에 저장</li><li>사람 필터: 노션은 담당자, 구글은 캘린더 소유/참석자, 연차는 제목의 이름 기준</li><li>정미경 개인일정 캘린더는 관리자만 보임</li></ul>`],
  ['2주 달력',`<ul><li>회사 일정·연차인사·정미경 개인일정 = 비공개 iCal 3개</li><li>노션 업무 = 목표일정(기간이면 시작~끝), 완료는 취소선</li><li>프로젝트 end = 점선 '종료'</li><li>회사 일정 중 주최자 ≠ ceo@ 인 외부 초대는 관리자에게만</li></ul>`],
  ['겹침·쏠림 자동 감지',`<ul><li><b>마감 쏠림</b>: 하루 마감(업무+프로젝트 종료) ≥ 5건</li><li><b>연차 겹침</b>: 연차 기간 ∩ 그 사람이 담당자인 업무 날짜</li><li><b>같은 날 몰림</b>: 한 사람 같은 날 마감 ≥ 2건</li><li>연차 제목 형식이 제각각('[종일/휴가]', '[휴가/종일]') → '[연차] 이름'으로 통일 권장</li></ul>`]],
 progress:[
  ['필터',`<ul><li>카테고리 칩(단일 선택) × 진행 상황 칩(단일 선택). 홈 숫자에서 오면 <code>health=지연</code></li></ul>`],
  ['요약 숫자',`<ul><li>이번 주 끝낸 업무 = 완료로 바뀐 시점(last_edited_time 또는 별도 완료일 속성) ≥ 이번 주 월요일. 정확히 하려면 업무 DB에 '완료일' 속성 추가 권장</li></ul>`],
  ['진행 상황 규칙 (카드 클릭 → 하위 업무 펼침)',`<ul><li><b>지연</b>: 지난 하위 업무 ≥1, 또는 마감일 없이 시작 후 21일 넘음</li><li><b>확인 필요</b>: 오늘 마감 · 하위 업무 0개 · 제목 없는 하위 업무 · 마감일도 다음 날짜도 없음</li><li><b>정상</b>: 그 외</li></ul>`],
  ['노션 정리 필요',`<ul><li>담당자 빈 업무 · 제목 빈 업무 · end 없는 진행중 프로젝트 · '이번 주 업데이트' 빈 프로젝트</li><li>클릭 → 노션 필터 뷰 링크</li></ul>`]],
 team:[
  ['부하 막대',`<ul><li>사람별 미완료 업무 = 지남 / 7일 안 / 이후·날짜 없음. 공동 담당은 각자 1건씩</li><li>막대 길이는 가장 많은 사람 기준</li></ul>`],
  ['사람 카드',`<ul><li>요일칸 연차 = 연차인사 캘린더에서 이름 매칭</li><li>이번 주 끝낸 일 = 완료일 ≥ 월요일</li></ul>`],
  ['담당자 지정',`<ul><li>백오피스에서 노션에 <b>쓰는 유일한 곳</b>: 업무 DB 담당자 속성 PATCH</li><li>권한: 관리자만</li></ul>`]],
 sales:[
  ['요약',`<ul><li>필드 매핑: 업체명(title) · 단계(status) · 제안서 발송일 · 다음 액션 · 다음 액션일 · 최근 접촉일 · 예상 금액(₩) · 담당자(person) · 제안 내용 · 관련 업무(업무 DB relation)</li><li>예상 금액 합계 = 단계 ∉ {성사, 드랍}</li></ul>`],
  ['단계별',`<ul><li>단계 그룹: 제안서 보내야 함 / 제안서 보냄 / 리드·컨택·미팅 / 성사. 드랍은 접어서</li><li>카드 안 정렬: 다음 액션일 오름차순</li><li>담당자는 노션 사용자(person) 타입 → 업무 DB(글자 선택지)와 매핑 방식이 다름</li></ul>`],
  ['팔로업',`<ul><li>회신 없음: 단계=제안서 보냄 AND 발송일+7 &lt; 오늘</li><li>다음 액션일 &lt; 오늘</li><li>최근 접촉일 &lt; 오늘−30 (성사·드랍 제외)</li><li>매주 월 09:00 담당자에게 슬랙 DM</li></ul>`]],
 content:[
  ['요약',`<ul><li>노션 🖼️ 콘텐츠 캘린더(<code>collection://38e414e3-6631-800b-927f-000b9470e80f</code>) 읽기 전용</li><li>마지막 발행완료 = 상태=발행완료 중 max(발행일)</li></ul>`],
  ['단계 막대 (클릭 → 필터)',`<ul><li>상태 5개 비율. 막대 클릭 시 아래 목록이 그 상태만</li></ul>`],
  ['발행이 막힌 것',`<ul><li>상태≠발행완료 AND (발행일 &lt; 오늘 OR 발행일 없음 OR 사진수급필요). 지남 먼저</li></ul>`],
  ['채널별',`<ul><li>카테고리 group by. 0건 채널은 빨간 숫자, 카테고리 없음=미분류</li></ul>`]],
 subs:[
  ['요약',`<ul><li>Supabase <code>subscriptions(name, cycle, next_billing_date, amount, card_last4, owner, status)</code></li><li>결제 3일 전 슬랙 #경영 (매일 09:00 cron)</li><li>결제일 지나면 next_billing_date 자동으로 다음 주기로</li></ul>`],
  ['목록 · 추가',`<ul><li>추가 폼은 바로 저장(관리자만). 카드 번호는 끝 4자리만</li><li>상태 칩: 사용중 → 해지 검토 → 해지됨 (삭제 없이 이력)</li></ul>`]],
 mail:[
  ['상태 탭',`<ul><li>액션 없음 / 진행중 / 기한 지남 / 완료. '기한 지남' = 진행중 AND 액션 기한 &lt; 오늘</li></ul>`],
  ['메일 목록',`<ul><li>share@ 공유 메일함을 Gmail API로 읽음. 전달한 사람 = 원래 받은 사람</li></ul>`],
  ['메모 · 액션 만들기',`<ul><li><b>메모 두 종류</b>: ① 전달 메모 = 공유 주소로 전달할 때 본문 맨 위에 쓴 글(원문 구분선 위 텍스트를 잘라 저장). ② 백오피스 메모 = 상세 화면에서 덧붙이는 짧은 글, Supabase <code>mail_notes(mail_id, author, text, created_at)</code></li><li>저장 → Supabase <code>todos</code>에 생성(백오피스 할 일) + 선택 시 노션 업무와 relation</li><li>슬랙 DM 체크 시 담당자에게 알림</li><li>'참고만'은 완료 탭으로</li></ul>`]]
};

function renderMemo(){
 const list = MEMO[state.screen]||[]; const body=document.getElementById('memoBody');
 document.getElementById('memoTitle').textContent='개발 메모 · '+({home:'홈',calendar:'캘린더',progress:'진행 현황',team:'팀 현황',sales:'영업',content:'콘텐츠',subs:'구독료',mail:'메일 공유함'})[state.screen];
 body.innerHTML = list.map((m,i)=>`<div class="mnote" data-note="${i+1}" tabindex="0"><b class="t"><span class="pin" style="display:inline-flex">${i+1}</span>${m[0]}</b>${m[1]}</div>`).join('') + `<div class="mnote" style="background:#FEF9C3"><b class="t">${MEMO.common[0]}</b>${MEMO.common[1]}</div>`;
}

/* ========= 렌더 & 이벤트 ========= */
function render(){
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.go===state.screen));
 document.getElementById('view').innerHTML = V[state.screen]();
 renderMemo();
 const q=new URLSearchParams({tab:state.screen}); if(state.screen==='progress'){q.set('cat',state.prog.cat);q.set('health',state.prog.health);} history.replaceState(null,'','#'+q.toString());
}
const ALLOWED=['home','calendar'];
function go(s,preset){ if(!ALLOWED.includes(s)){ toast('이 파일에는 홈·캘린더 화면만 들어 있어요'); return; } state.screen=s; if(s==='progress'&&preset){state.prog.health=preset;state.prog.cat='전체';} render(); window.scrollTo(0,0); }

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-go]'); if(!t) return;
 if(t.dataset.go){ go(t.dataset.go,t.dataset.preset); return; }
 if(t.dataset.pin){ const n=t.dataset.pin; if(!document.getElementById('memo').classList.contains('open')) toggleMemo(true); const el=document.querySelector(`.mnote[data-note="${n}"]`); if(el){document.querySelectorAll('.mnote').forEach(x=>x.classList.remove('hl')); el.classList.add('hl'); el.scrollIntoView({behavior:'smooth',block:'center'});} return; }
 if(t.dataset.src){ state.cal[t.dataset.src]=!state.cal[t.dataset.src]; render(); return; }
 if(t.dataset.cat){ state.prog.cat=t.dataset.cat; render(); return; }
 if(t.dataset.health){ state.prog.health=t.dataset.health; render(); return; }
 if(t.dataset.proj){ state.prog.open = state.prog.open===t.dataset.proj?null:t.dataset.proj; render(); return; }
 if(t.dataset.st){ state.content.st = state.content.st===t.dataset.st?null:t.dataset.st; render(); return; }
 if(t.id==='stClear'){ state.content.st=null; render(); return; }
 if(t.id==='exBtn'){ state.salesEx=!state.salesEx; render(); return; }
 if(t.dataset.assign!==undefined){ const sel=document.getElementById('as'+t.dataset.assign); if(sel.selectedIndex>0){ const task=TASKS.filter(x=>!x.who.length&&x.t)[+t.dataset.assign]; task.who=[sel.value]; toast(`'${task.t}' 담당자를 ${sel.value}(으)로 지정했어요 · 실제로는 노션에 저장`); render(); } else toast('담당자를 먼저 고르세요'); return; }
 if(t.dataset.subst!==undefined){ const s=state.subs[+t.dataset.subst]; s.st = {'사용중':'해지 검토','해지 검토':'해지됨','해지됨':'사용중'}[s.st]; render(); return; }
 if(t.dataset.mtab){ state.mailTab=t.dataset.mtab; const f=state.mails.find(m=>state.mailTab==='over'?(m.st==='doing'&&m.action&&dnum(m.action.d)<0):m.st===state.mailTab); state.mailSel=f?f.id:null; render(); return; }
 if(t.dataset.mail){ state.mailSel=+t.dataset.mail; render(); return; }
 if(t.id==='refOnly'){ const m=state.mails.find(x=>x.id===state.mailSel); m.st='done'; m.action={t:'참고만',who:m.by,d:TODAY}; toast('완료 탭으로 옮겼어요'); render(); return; }
 if(t.id==='mailDone'){ const m=state.mails.find(x=>x.id===state.mailSel); m.st='done'; toast('완료 처리했어요'); render(); return; }
});
document.addEventListener('change',e=>{
 if(e.target.dataset.goal!==undefined){ state.goals[+e.target.dataset.goal].done=e.target.checked; render(); }
 if(e.target.id==='calPerson'){ state.cal.person=e.target.value; render(); }
 if(e.target.id==='role'){ state.role=e.target.value; render(); }
});
document.addEventListener('submit',e=>{
 e.preventDefault(); const f=e.target;
 if(f.id==='goalForm'){ const v=f.querySelector('input').value.trim(); if(v){ state.goals.push({t:v,who:state.role,done:false}); render(); } }
 if(f.id==='subForm'){ const d=Object.fromEntries(new FormData(f)); state.subs.push({n:d.n,cyc:d.cyc,d:d.d?md(d.d):'[결제일]',amt:d.amt?Number(d.amt).toLocaleString('ko-KR')+'원':'[금액]',card:d.card?'법인카드 '+d.card:'[카드]',who:state.role,st:'사용중'}); toast(d.n+' 추가했어요'); render(); }
 if(f.id==='noteForm'){ const v=f.querySelector('input').value.trim(); if(v){ const m=state.mails.find(x=>x.id===state.mailSel); (m.notes=m.notes||[]).push({who:state.role,t:v}); render(); } }
 if(f.id==='actForm'){ const d=Object.fromEntries(new FormData(f)); const m=state.mails.find(x=>x.id===state.mailSel); m.st='doing'; m.action={t:d.t,who:d.who,d:d.d}; toast(`${d.who} 님 할 일로 보냈어요${d.link?' · 노션 업무와 연결':''} · 슬랙 DM`); state.mailTab='doing'; render(); }
});
function toggleMemo(force){ const m=document.getElementById('memo'), on = force!==undefined?force:!m.classList.contains('open'); m.classList.toggle('open',on); document.body.classList.toggle('memo-on',on); const b=document.getElementById('memoBtn'); b.setAttribute('aria-pressed',on); b.textContent=on?'개발 메모 닫기':'개발 메모 열기'; }
document.getElementById('memoBtn').onclick=()=>toggleMemo();
document.getElementById('memoClose').onclick=()=>toggleMemo(false);
document.getElementById('memoBody').addEventListener('click',e=>{ const n=e.target.closest('.mnote[data-note]'); if(!n) return; const p=document.querySelector(`#view .pin[data-pin="${n.dataset.note}"]`); if(p){ const sec=p.closest('.sec')||p.closest('section')||p; sec.scrollIntoView({behavior:'smooth',block:'start'}); sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash'); }});

const h=new URLSearchParams(location.hash.slice(1)); if(h.get('tab')&&ALLOWED.includes(h.get('tab'))) { state.screen=h.get('tab'); if(h.get('cat')) state.prog.cat=h.get('cat'); if(h.get('health')) state.prog.health=h.get('health'); }
render();
</script>
</body>
</html>
